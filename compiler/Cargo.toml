[package]
name = "reactivescript"
version = "0.1.0"
edition = "2021"
description = "ReactiveScript's compiler (spec/11): parse, check, resolve, and lower through Solid's solidjs-compiler"
license = "MIT"
publish = false

[lib]
name = "reactivescript"
path = "src/lib.rs"
# rlib for rxc; cdylib for the Node-API build (`--features node`, src/node.rs) that @reactivescript/compiler ships, and
# for the WebAssembly build the language server loads (src/wasm.rs, CP-8e)
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rxc"
path = "src/main.rs"

[features]
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
indexmap = "2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# CP-1b: Solid's compiler, at the commit ref/ runs on (ref/SOLID_NEXT), and the Oxc release it is built against (CP-1c:
# the program crosses the seam, so the versions must match)
solidjs-compiler = { git = "https://github.com/solidjs/solid", rev = "2105ffb8ca2fced55f5fac0763177fc93f97c2c2", default-features = false }
oxc_allocator = "0.144"
oxc_ast = "0.144"
oxc_span = "0.144"
oxc_sourcemap = "8.1"
oxc_syntax = "0.144"
napi = { version = "=3.12.1", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "=3.6.3", optional = true }

[build-dependencies]
napi-build = "=2.4.1"   # held with napi and napi-derive: the WASI build's emnapi setup (build.rs) is written for this set

[profile.release]
debug = false
